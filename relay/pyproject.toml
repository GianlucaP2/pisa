[project]
name = "pisa-relay"
version = "0.1.0"
description = "Pisa's push relay: hands sealed push signals from self-hosted Pisa servers to Apple, learning nothing"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.163.1",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "httpx[http2]==0.28.1",
    "h2==4.4.1",
    "pyjwt[crypto]==2.15.1",
    "cryptography==50.0.2",
]

[project.scripts]
pisa-relay = "pisa_relay.app:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.5",
    "pyright==1.1.414",
    # the interop test runs the Pisa server's own sender (core/pisa) against this relay
    "pyhpke==0.6.5",
    "structlog==26.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pisa_relay"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S603", "S607"]

[tool.pyright]
include = ["pisa_relay", "tests"]
typeCheckingMode = "standard"
pythonVersion = "3.13"
strict = ["pisa_relay"]
extraPaths = ["../core"]  # the interop test imports the Pisa server's sender

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
