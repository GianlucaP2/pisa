# gitleaks: the default rules, plus the contract's published synthetic test values (and nothing else).
#
# A finding is ignored only when it is in protocol/v2/fixtures/pairing/vectors.json AND its matched value contains
# one of the stopwords below: exact, distinctive fragments of synthetic values that the contract publishes as test
# vectors. The same value anywhere else is still a finding. No other paths, commits or patterns are allowed.
# core/tests/test_gitleaks_allowlist.py checks that every stopword is a documented test value in
# protocol/v2/fixtures/pairing/vectors.json, and that nothing else is allowed. That file is the contract's
# language-neutral vector set, published verbatim (its field names, tokenHex, deviceKey, token, keyHex, are the
# contract's): it cannot build its values at run time, so these five stay. Every other test value is assembled at
# run time (core/tests/test_no_literal_secrets.py).
[extend]
useDefault = true

[[allowlists]]
condition = "AND"
paths = ['''(^|/)protocol/v2/fixtures/pairing/vectors\.json$''']
description = "The contract's synthetic pairing and push test vectors (protocol/v2/fixtures/pairing/vectors.json)"
stopwords = [
    "8f1e2d3c4b5a69788796a5b4c3d2e1f0",                                   # pairing.tokenHex
    "zNxNTlUQrua6L96DvuFUh3s",                                            # pairing.deviceKey (test P-256 key, after its header)
    "R4PC2PCLLJUXRB4WUW2MHUXB6A",                                         # pairing.token (base32 of tokenHex)
    "29e754e7182136842bef82858805a2998f8f69df8a8e4fbad416adec78649c26",   # relay.keyHex (sha256 of the test secret)
    "55ba834e-40eb-8f96-88a3-4ac1fd42cf59",                               # relay.appApi.appAccountToken (key 00..1f)
]
