# The documentation site: builds docs-site/ with MkDocs Material (mkdocs.yml, requirements-docs.txt) and deploys
# it to GitHub Pages. GitHub-hosted runners only; actions pinned by commit SHA.
#
# A maintainer sets the repository's Settings > Pages > Source to "GitHub Actions" once. The site's address is
# derived from the repository's own owner and name (its project Pages address); a repository variable
# PISA_DOCS_SITE_URL overrides it, for a custom domain.
name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - "mkdocs.yml"
      - "mkdocs_hooks.py"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.13"
      - name: the site's address, from the repository's own owner and name
        env:
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          OVERRIDE: ${{ vars.PISA_DOCS_SITE_URL }}
        run: |
          owner="${OWNER,,}"
          repo="${REPOSITORY#*/}"
          if [ -n "$OVERRIDE" ]; then
            url="$OVERRIDE"
          elif [ "${repo,,}" = "${owner}.github.io" ]; then
            url="https://${owner}.github.io/"
          else
            url="https://${owner}.github.io/${repo}/"
          fi
          echo "PISA_DOCS_SITE_URL=$url" >> "$GITHUB_ENV"
          echo "PISA_DOCS_REPO_URL=$SERVER_URL/$REPOSITORY" >> "$GITHUB_ENV"
          echo "site: $url"
      - name: install MkDocs (pinned, with hashes)
        run: |
          uv venv .docs-venv
          uv pip install --python .docs-venv --require-hashes -r requirements-docs.txt
      - name: build, strict (a broken link or anchor fails)
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: .docs-venv/bin/mkdocs build --strict
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
